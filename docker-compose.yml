services:
  postgres:
    image: postgres:17-alpine
    container_name: znews-postgres
    environment:
      POSTGRES_DB: znews
      POSTGRES_USER: znews
      POSTGRES_PASSWORD: znews
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - znews-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U znews -d znews"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  znews-postgres-data:
